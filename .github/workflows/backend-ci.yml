name: Backend CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

# Cancel in-progress runs for the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry --version

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run Ruff linter
        run: poetry run ruff check src tests

      - name: Run Ruff formatter check
        run: poetry run ruff format --check src tests

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry --version

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Run tests
        run: poetry run pytest -v --tb=short

      - name: Upload coverage report (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/.pytest_cache/
          if-no-files-found: ignore

  migrate:
    name: Apply Alembic migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      BACKEND_DATABASE_URL: 'sqlite+aiosqlite:///ci_test.db'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry --version

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Show current migration revision
        run: poetry run alembic current

      - name: Apply migrations
        run: poetry run alembic upgrade head

      - name: Verify migrations are up to date
        run: poetry run alembic check
