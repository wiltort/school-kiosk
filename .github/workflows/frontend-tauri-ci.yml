name: Frontend & Tauri CI

# Линт/формат/типы для frontend (React) и Rust-оболочки (src-tauri).
# Запускается на push в main/dev (по затронутым путям) и на КАЖДОМ PR,
# который меняет frontend/** или src-tauri/**.

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'
      - 'src-tauri/**'
      - '.github/workflows/frontend-tauri-ci.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'
      - 'src-tauri/**'
      - '.github/workflows/frontend-tauri-ci.yml'

# Отменяем in-progress ран для той же ветки/PR при новом пуше.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Check formatting (Prettier)
        run: npm run format:check

  rust:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Системные зависимости Tauri v2 (нужны, чтобы glib-sys/webkit2gtk-sys
      # находили .pc-файлы через pkg-config). Без них на ubuntu-latest
      # cargo clippy падает с "Package glib-2.0 was not found".
      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Check formatting (cargo fmt)
        run: cargo fmt --check

      - name: Lint (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings
