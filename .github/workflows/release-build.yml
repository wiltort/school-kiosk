name: Release build (updater)

# Собирает установщик для веток main/dev, подписывает его minisign,
# публикует в GitHub Releases и обновляет JSON-фид в ветке `update-feed`.
#
# Сборка из ветки dev -> канал dev, из ветки main -> канал main.
# Приложение обновляется только из своего канала (см. src-tauri/src/updater.rs).

on:
  push:
    branches: [main, dev]
    paths:
      - 'frontend/**'
      - 'src-tauri/**'
      - 'backend/**'
      - '.github/workflows/release-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-and-release:
    name: Build & publish (${{ github.ref_name }})
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute channel / version / tag
        id: meta
        shell: bash
        run: |

          CHANNEL="${{ github.ref_name }}"
          SEMVER_CORE=$(grep '^version =' backend/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          VERSION="${SEMVER_CORE}-${CHANNEL}.${{ github.run_number }}"
          TAG="${CHANNEL}-v${VERSION}"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install backend dependencies
        run: poetry install --no-interaction
        working-directory: backend

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2 --locked

      - name: Build backend executable (PyInstaller)
        # ВАЖНО: ресурсы Alembic (alembic.ini + каталог alembic/) обязательно
        # должны попасть в onefile-сборку, иначе бэкенд падает при старте:
        # run_migrations() → _make_config() → "No config file ... found".
        # Флаги дублируют make build-backend (см. Makefile).
        run: poetry run pyinstaller --noconfirm --clean --onefile --name python-backend --collect-submodules uvicorn --hidden-import aiosqlite --add-data "alembic;alembic" --add-data "alembic.ini;." run_backend.py
        working-directory: backend

      # Гейт на публикацию: если собранный python-backend.exe не стартует на
      # «свежей установке» (не создаёт БД, не применяет миграции, не отвечает
      # на API), релиз не публикуется. Тесты см. backend/tests/integration.
      - name: Smoke-test backend executable (fresh install)
        shell: bash
        env:
          KIOSK_BACKEND_EXE: ${{ github.workspace }}/backend/dist/python-backend.exe
        run: poetry run pytest tests/integration -q
        working-directory: backend

      - name: Stage externalBin
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p src-tauri/binaries
          cp backend/dist/python-backend.exe "src-tauri/binaries/python-backend-${host}.exe"

      - name: Set release version
        run: python scripts/set_release_version.py --version "${{ steps.meta.outputs.version }}"

      - name: Build updater artifacts (release)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MINISIGN_PRIVATE_KEY_PASSWORD }}
          KIOSK_CHANNEL: ${{ steps.meta.outputs.channel }}
          KIOSK_REPO: ${{ github.repository }}
          # Включаем генерацию updater-артефактов только в CI через CLI-флаг --config,
          # который tauri-cli применяет гарантированно (env TAURI_CONFIG не всегда
          # мержится при `cargo tauri build`). Локальная `make build` без этого
          # флага может работать и без подписанных артефактов.
        run: cd src-tauri && cargo tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Verify updater signatures
        shell: bash
        run: |
          echo "=== NSIS bundle contents ==="
          ls -la src-tauri/target/release/bundle/nsis/ || true
          if [ -n "${{ secrets.MINISIGN_PRIVATE_KEY }}" ]; then
            if ! ls src-tauri/target/release/bundle/nsis/*.sig >/dev/null 2>&1; then
              echo "::error::MINISIGN_PRIVATE_KEY is set, but no updater artifacts (*.sig) were produced."
              echo "Likely causes:"
              echo "  1) TAURI_CONFIG createUpdaterArtifacts=true did not reach the build;"
              echo "  2) the private key / password is wrong (check for literal '\\n' instead of real newlines);"
              echo "  3) the secret was added after this run started."
              exit 1
            fi
          else
            echo "MINISIGN_PRIVATE_KEY secret is NOT set - updater artifacts (.sig) will not be generated."
          fi

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Подписи (.sig) появляются только при настроенном секрете
          # MINISIGN_PRIVATE_KEY; без них релиз всё равно создаём.
          sigs=""
          if ls src-tauri/target/release/bundle/nsis/*.sig >/dev/null 2>&1; then
            sigs=src-tauri/target/release/bundle/nsis/*.sig
          fi
          # shellcheck disable=SC2086
          gh release create "${{ steps.meta.outputs.tag }}" \
            src-tauri/target/release/bundle/nsis/*.exe \
            $sigs \
            --title "${{ steps.meta.outputs.version }}" \
            --notes "Release для канала ${{ steps.meta.outputs.channel }}."

      - name: Publish update feed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ls src-tauri/target/release/bundle/nsis/*.sig >/dev/null 2>&1; then
            bash scripts/publish_feed.sh \
              "${{ github.repository }}" \
              "${{ steps.meta.outputs.channel }}" \
              "${{ steps.meta.outputs.version }}" \
              "${{ steps.meta.outputs.tag }}" \
              "src-tauri/target/release/bundle/nsis/"*.exe \
              "src-tauri/target/release/bundle/nsis/"*.exe.sig \
              "$GH_TOKEN"
          else
            echo "Signature (.sig) not found - update feed skipped. Configure the MINISIGN_PRIVATE_KEY secret to enable auto-updates."
          fi
      - name: Trigger release smoke test
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-smoke.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="${{ steps.meta.outputs.tag }}"
