[project]
name = "SchoolKioskBackend"
version = "0.1.0"
description = ""
authors = [
    {name = "Wiltort",email = "wiltort21@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite (>=0.21.0,<1.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "uvicorn (>=0.52.1,<0.53.0)",
    "alembic (>=1.18.5,<2.0.0)"
]

[tool.poetry]
packages = [{include = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "httpx2 (>=2.9.1,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)"
]

# ============================================================
# Ruff — linter + formatter (replaces flake8 + isort + black)
# ============================================================
[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "S",    # bandit security
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "E501",  # line-too-long — handled by formatter
]

[tool.ruff.lint.flake8-bugbear]
# Allow FastAPI's `Depends()` in argument defaults — this is the standard,
# idiomatic DI pattern and is not an "unsafe" function call.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ============================================================
# isort — import sorting (Ruff handles this too, but keep for
#          compatibility if someone runs isort directly)
# ============================================================
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# ============================================================
# Black — code formatter (Ruff also formats, but keep for
#          compatibility if someone runs black directly)
# ============================================================
[tool.black]
line-length = 88
target-version = ["py314"]
skip-magic-trailing-comma = true

# ============================================================
# Flake8 — kept for compatibility (Ruff covers all these rules)
# ============================================================
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
max-complexity = 10

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[project.scripts]
app = "src.main:start"
